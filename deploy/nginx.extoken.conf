# ==========================================================================
# Extoken 私有化部署 - Nginx 配置样例
# 把本文件复制到 ECS 的 /etc/nginx/conf.d/extoken.conf
# 然后执行：nginx -t && systemctl reload nginx
# ==========================================================================

# ---- 1. HTTP → HTTPS 301 强制跳转 ----
server {
    listen                  80;
    listen                  [::]:80;
    server_name             extoken.your-domain.com;  # ① 改成你的域名
    return                  301 https://$host$request_uri;
}

# ---- 2. HTTPS 主站配置 ----
server {
    listen                  443 ssl http2;
    listen                  [::]:443 ssl http2;
    server_name             extoken.your-domain.com;  # ② 改成你的域名

    # -------------------- Let's Encrypt HTTPS 证书（certbot 自动生成）--------------------
    # 执行 certbot 之前，下面两行可先用临时的自签证书注释掉
    ssl_certificate         /etc/letsencrypt/live/extoken.your-domain.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/extoken.your-domain.com/privkey.pem;
    # 若用阿里云/腾讯云免费证书，路径改成：
    # ssl_certificate     /etc/nginx/ssl/your-domain.pem;
    # ssl_certificate_key /etc/nginx/ssl/your-domain.key;

    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache       shared:SSLextk:10m;
    ssl_session_timeout     1d;
    ssl_session_tickets     off;

    # OCSP Stapling
    ssl_stapling            on;
    ssl_stapling_verify     on;
    resolver                223.5.5.5 114.114.114.114 valid=300s;
    resolver_timeout        5s;

    # 上传 / 下载限制：extoken 包可能有几 MB
    client_max_body_size    64m;

    # HSTS（开启前请确认 HTTPS 长期稳定运行）
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options               SAMEORIGIN always;
    add_header X-Content-Type-Options        nosniff always;
    add_header Referrer-Policy               strict-origin-when-cross-origin always;
    add_header Permissions-Policy            "camera=(), microphone=(), geolocation=()" always;

    # Gzip
    gzip                    on;
    gzip_vary               on;
    gzip_proxied            any;
    gzip_min_length         1024;
    gzip_comp_level         6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml application/rss+xml
        font/ttf font/otf font/woff font/woff2
        image/svg+xml;

    # ---- 健康检查 ----
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true,"ts":$msec}';
    }

    # ---- 静态资源长缓存（/assets/* 是 vite build 产物） ----
    location ~* ^/assets/ {
        alias  /opt/extoken/dist/client/assets/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---- 其它静态资源（favicon 等） ----
    location ~* \.(?:css|js|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|webp|avif|ico|map)$ {
        root   /opt/extoken/dist/client;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # ---- 反代后端 API：/api 和 /openapi ----
    location ~ ^/(api|openapi)/ {
        proxy_pass          http://127.0.0.1:3000;   # ③ 与 .env 的 SERVER_PORT 保持一致
        proxy_http_version  1.1;
        proxy_set_header    Host               $host;
        proxy_set_header    X-Real-IP          $remote_addr;
        proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto  $scheme;
        proxy_set_header    X-Forwarded-Host   $host;
        proxy_set_header    X-Request-Id       $request_id;

        proxy_read_timeout      120s;
        proxy_connect_timeout   5s;
        proxy_send_timeout      120s;

        # WebSocket 预留（如果以后加实时功能）
        proxy_set_header    Upgrade            $http_upgrade;
        proxy_set_header    Connection         $connection_upgrade;
    }

    # ---- 兜底：前端 HTML（配合前端 BrowserRouter，所有非 API 路径都返回 index.html）----
    location / {
        root                /opt/extoken/dist/client;
        index               index.html;
        try_files           $uri $uri/ /index.html;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
